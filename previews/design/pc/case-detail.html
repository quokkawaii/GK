<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK 산업 | 시공 사례 상세 사진 시안</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ececea;color:#242424;font:15px/1.55 Arial,"Noto Sans KR",sans-serif}.wrap{max-width:860px;margin:auto;padding:36px 20px 70px}.intro{margin-bottom:20px}.intro h1{margin:0 0 7px;font-size:27px;letter-spacing:-1.7px}.intro p{margin:0;color:#687068}.page{background:#fff;border:1px solid #d9d9d6;box-shadow:0 8px 20px #00000011}.header{height:58px;padding:0 21px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}.logo{font-size:20px;font-weight:900}.logo em{color:#e36f3f;font-style:normal}.call{font-size:11px;padding:8px 11px;background:#e36f3f;color:#fff;font-weight:800}.menu{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:30px;padding:13px;border-bottom:1px solid #ddd;background:#fff;font-size:12px;font-weight:700}.menu span:nth-child(2){color:#e36f3f}.content{padding:26px}.back{font-size:12px;color:#666}.title{margin:17px 0}.title span{font-size:10px;color:#d15f34;font-weight:800}.title h2{margin:4px 0 0;font-size:29px;letter-spacing:-1.8px}.photo{position:relative;overflow:hidden;background:linear-gradient(145deg,#8c8c88,#30302e)}.photo:after{content:"";position:absolute;left:-8%;bottom:-5%;width:116%;height:42%;transform:rotate(-7deg);background:repeating-linear-gradient(90deg,#262624 0 31px,#696965 31px 35px)}.gallery{border:1px solid #ddd}.main-photo{height:390px}.gallery-stage{position:relative}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:58px;border:0;background:#11111175;color:#fff;font-size:34px;cursor:pointer}.arrow.prev{left:12px}.arrow.next{right:12px}.gallery-bottom{padding:13px;background:#f8f8f6}.counter{text-align:center;margin-bottom:10px;color:#555;font-size:12px}.thumbs{display:flex;justify-content:center;gap:7px;overflow-x:auto}.thumb{flex:0 0 62px;height:48px;padding:0;border:2px solid transparent;background:linear-gradient(145deg,#8c8c88,#30302e);cursor:pointer}.thumb.active{border-color:#e36f3f}.details{margin-top:34px;padding-top:22px;border-top:1px solid #ddd}.details h3{margin:0 0 9px;font-size:16px}.details p{max-width:650px;margin:0;color:#515151;word-break:keep-all}.detail-list{display:grid;grid-template-columns:120px 1fr;gap:0;margin:20px 0 0;border-top:1px solid #e1e1de}.detail-list div{padding:11px;border-bottom:1px solid #e1e1de;font-size:13px}.detail-list div:nth-child(odd){background:#f7f7f5;font-weight:800}@media(max-width:600px){.wrap{padding:22px 12px}.content{padding:20px 15px}.menu{gap:17px;font-size:11px}.main-photo{height:260px}.arrow{width:38px;height:50px}.arrow.prev{left:5px}.arrow.next{right:5px}.detail-list{grid-template-columns:95px 1fr}}
    .arrow{background:transparent;text-shadow:0 1px 5px #000}.main-photo{cursor:zoom-in}.viewer{position:fixed;z-index:20;inset:0;display:none;flex-direction:column;background:#111;color:#fff}.viewer.open{display:flex}.viewer-head{height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.close{border:0;background:transparent;color:#fff;font-size:28px;cursor:pointer}.viewer-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:16px 78px}.viewer-photo{width:min(940px,100%);height:100%;min-height:300px;max-height:620px}.viewer .gallery-bottom{background:#111}.viewer .counter{color:#eee}.viewer .arrow.prev{left:18px}.viewer .arrow.next{right:18px}@media(max-width:600px){.viewer-stage{padding:12px 48px}.viewer .arrow.prev{left:5px}.viewer .arrow.next{right:5px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="intro"><h1>시공 사례 상세 — 사진 확대 시안</h1><p>아래 대표 사진을 눌러 확대 화면에서 화살표, 사진 위치, 남은 사진을 직접 확인해 보세요.</p></header>
    <article class="page">
      <div class="header"><div class="logo">GK <em>산업</em></div><span class="call">전화 문의</span></div>
      <nav class="menu" aria-label="기본 메뉴"><span>홈</span><span>시공 사례</span><span>사용 제품</span><span>회사 소개</span></nav>
      <div class="content">
        <div class="back">← 시공 사례 목록</div>
        <div class="title"><span>공장 · 에폭시</span><h2>화성시 공장 에폭시</h2></div>
        <section class="gallery" aria-label="시공 사진">
          <div class="gallery-stage"><div class="photo main-photo" data-open-viewer role="button" tabindex="0" aria-label="사진 확대 보기"></div><button class="arrow prev" type="button" aria-label="이전 사진">‹</button><button class="arrow next" type="button" aria-label="다음 사진">›</button></div>
          <div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active" type="button" aria-label="1번 사진"></button><button class="thumb" type="button" aria-label="2번 사진"></button><button class="thumb" type="button" aria-label="3번 사진"></button><button class="thumb" type="button" aria-label="4번 사진"></button><button class="thumb" type="button" aria-label="5번 사진"></button><button class="thumb" type="button" aria-label="6번 사진"></button></div></div>
        </section>
        <section class="details"><h3>시공 내용</h3><p>예시 설명입니다. 현장 바닥 상태를 확인한 뒤 에폭시 공법을 적용한 시공 사례입니다. 실제 서비스에서는 현장에 맞는 설명으로 교체합니다.</p><div class="detail-list"><div>시공 장소</div><div>화성시 공장</div><div>적용 공법</div><div>에폭시 바닥 시공</div><div>사용 제품</div><div>에폭시 코팅제 (예시)</div></div></section>
      </div>
    </article>
  </main>
  <section class="viewer" aria-label="시공 사진 확대 보기" aria-hidden="true">
    <div class="viewer-head"><span>시공 사진</span><button class="close" type="button" aria-label="사진 확대 닫기">×</button></div>
    <div class="viewer-stage"><div class="photo viewer-photo"></div><button class="arrow prev" type="button" aria-label="이전 사진">‹</button><button class="arrow next" type="button" aria-label="다음 사진">›</button></div>
    <div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active" type="button" aria-label="1번 사진"></button><button class="thumb" type="button" aria-label="2번 사진"></button><button class="thumb" type="button" aria-label="3번 사진"></button><button class="thumb" type="button" aria-label="4번 사진"></button><button class="thumb" type="button" aria-label="5번 사진"></button><button class="thumb" type="button" aria-label="6번 사진"></button></div></div>
  </section>
  <script>
    const viewer = document.querySelector('.viewer');
    const groups = [...document.querySelectorAll('.thumbs')];
    const counters = [...document.querySelectorAll('.counter b')];
    const photoCount = 6;
    let currentPhoto = 0;
    function showPhoto(index) {
      currentPhoto = (index + photoCount) % photoCount;
      counters.forEach((counter) => { counter.textContent = currentPhoto + 1; });
      groups.forEach((group) => [...group.children].forEach((thumbnail, thumbnailIndex) => thumbnail.classList.toggle('active', thumbnailIndex === currentPhoto)));
    }
    document.querySelectorAll('.prev').forEach((button) => button.addEventListener('click', () => showPhoto(currentPhoto - 1)));
    document.querySelectorAll('.next').forEach((button) => button.addEventListener('click', () => showPhoto(currentPhoto + 1)));
    groups.forEach((group) => [...group.children].forEach((thumbnail, index) => thumbnail.addEventListener('click', () => showPhoto(index))));
    function openViewer() { viewer.classList.add('open'); viewer.setAttribute('aria-hidden', 'false'); }
    document.querySelector('[data-open-viewer]').addEventListener('click', openViewer);
    document.querySelector('[data-open-viewer]').addEventListener('keydown', (event) => { if (event.key === 'Enter') openViewer(); });
    document.querySelector('.close').addEventListener('click', () => { viewer.classList.remove('open'); viewer.setAttribute('aria-hidden', 'true'); });
  </script>
</body>
</html>
