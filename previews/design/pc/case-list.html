<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK 산업 | 시공 사례 필터 시안</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ececea;color:#242424;font:15px/1.55 Arial,"Noto Sans KR",sans-serif}.wrap{max-width:960px;margin:auto;padding:38px 20px 72px}.intro{margin-bottom:20px}.intro h1{margin:0 0 8px;font-size:27px;letter-spacing:-1.7px}.intro p{margin:0;color:#687068}.screen{background:#fff;border:1px solid #d9d9d6;box-shadow:0 8px 20px #00000011}.nav{height:58px;padding:0 20px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #ddd}.logo{font-size:20px;font-weight:900;white-space:nowrap}.logo em{font-style:normal;color:#e36f3f}.menu{display:flex;gap:15px;margin-left:auto;font-size:11px;font-weight:700}.menu span:first-child{color:#e36f3f}.call{font-size:11px;background:#e36f3f;color:#fff;font-weight:800;padding:8px 11px;white-space:nowrap}.title{padding:31px 21px 19px;background:linear-gradient(135deg,#171717,#444);color:#fff}.title span{font-size:10px;color:#ef875d;font-weight:800;letter-spacing:.12em}.title h2{font-size:30px;letter-spacing:-2px;margin:5px 0 0}.main{padding:22px}.filter{border:1px solid #dbdbd7;background:#f8f8f6;padding:16px}.filter-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:13px;border-bottom:1px solid #deded9}.filter-head b{font-size:13px}.filter-head span{font-size:11px;color:#777}.filter-row{display:flex;gap:16px;padding-top:14px}.filter-label{width:68px;padding-top:7px;color:#555;font-size:11px;font-weight:800}.filter-options{display:flex;flex-wrap:wrap;gap:6px;flex:1}.chip{padding:7px 10px;border:1px solid #cfcfcb;font-size:11px;background:#fff}.chip.on{background:#e36f3f;color:#fff;border-color:#e36f3f;font-weight:800}.reset{align-self:flex-start;margin-left:7px;border:0;background:transparent;text-decoration:underline;font-size:11px;color:#555;white-space:nowrap;padding:7px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}.card{border:1px solid #ddd}.pic{height:230px;background:linear-gradient(145deg,#888,#333);position:relative;overflow:hidden}.pic:after{content:"";position:absolute;width:120%;height:40%;bottom:-12%;left:-10%;transform:rotate(-8deg);background:repeating-linear-gradient(90deg,#292929 0 22px,#696969 22px 25px)}.copy{padding:14px}.tag{font-size:10px;color:#d15f34;font-weight:800}.name{font-size:16px;font-weight:800;margin-top:3px}.note{padding:15px 20px;background:#f3f1ef;color:#515151;font-size:13px}@media(max-width:560px){.wrap{padding:24px 14px}.nav{padding:0 14px;gap:10px}.menu{display:none}.filter-row{gap:9px}.filter-label{width:58px}.pic{height:160px}.reset{margin-left:0}.filter-head span{display:none}}
    .nav{justify-content:space-between;gap:0}.nav .menu{display:none}.primary-menu{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:30px;padding:13px 20px;border-bottom:1px solid #ddd;background:#fff;font-size:12px;font-weight:700;box-shadow:0 5px 10px #00000008}.primary-menu span:first-child{color:#e36f3f}.filter-title{display:flex;align-items:center;gap:9px}.filter-head .reset{margin:0;padding:0;align-self:auto}.filter-options{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;cursor:grab;user-select:none}.filter-options:active{cursor:grabbing}.filter-options .chip{flex:0 0 auto}.drag-guide{font-size:10px;color:#858585;white-space:nowrap;padding-top:7px}
    .pagination{display:flex;justify-content:center;gap:5px;margin-top:22px}.page{min-width:31px;height:31px;border:1px solid #d3d3cf;background:#fff;font-size:11px}.page.on{border-color:#e36f3f;background:#e36f3f;color:#fff;font-weight:800}.page.next{width:auto;padding:0 10px}
    @media(max-width:560px){.drag-guide{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="intro">
      <h1>시공 사례 필터 — 수정 A안</h1>
      <p>장소와 시공 자재를 구분해 선택하고, 두 조건을 모두 만족하는 사례만 보여주는 화면입니다.</p>
    </header>
    <section class="screen" aria-label="시공 사례 목록 시안">
      <div class="nav"><div class="logo">GK <em>산업</em></div><span class="call">전화 문의</span></div>
      <nav class="primary-menu" aria-label="기본 메뉴"><span>홈</span><span>시공 사례</span><span>사용 제품</span><span>회사 소개</span></nav>
      <div class="title"><span>CASE STUDIES</span><h2>시공 사례</h2></div>
      <div class="main">
        <section class="filter" aria-label="시공 사례 필터">
          <div class="filter-head"><div class="filter-title"><b>태그 필터</b><button class="reset" type="button">필터 초기화</button></div><span>선택한 조건을 모두 만족하는 사례</span></div>
          <div class="filter-row">
            <div class="filter-label">시공 장소</div>
            <div class="filter-options"><button class="chip on" type="button">공장</button><button class="chip" type="button">주차장</button><button class="chip" type="button">주방</button><button class="chip" type="button">공사장 1</button><button class="chip" type="button">공사장 2</button><button class="chip" type="button">공사장 3</button><button class="chip" type="button">공사장 4</button><button class="chip" type="button">공사장 5</button><button class="chip" type="button">공사장 6</button><button class="chip" type="button">공사장 7</button><button class="chip" type="button">공사장 8</button><button class="chip" type="button">공사장 9</button><button class="chip" type="button">공사장 10</button></div><span class="drag-guide">← 드래그</span>
          </div>
          <div class="filter-row">
            <div class="filter-label">시공 자재</div>
            <div class="filter-options"><button class="chip on" type="button">에폭시</button><button class="chip" type="button">우레탄</button><button class="chip" type="button">MMA</button></div><span class="drag-guide">← 드래그</span>
          </div>
        </section>
        <div class="cards">
          <article class="card"><div class="pic"></div><div class="copy"><span class="tag">공장 · 에폭시</span><div class="name">화성시 공장</div></div></article>
          <article class="card"><div class="pic"></div><div class="copy"><span class="tag">공장 · 에폭시</span><div class="name">평택시 공장</div></div></article>
          <article class="card"><div class="pic"></div><div class="copy"><span class="tag">공장 · 에폭시</span><div class="name">안산시 공장</div></div></article>
          <article class="card"><div class="pic"></div><div class="copy"><span class="tag">주차장 · 에폭시</span><div class="name">수원시 주차장</div></div></article>
        </div>
        <nav class="pagination" aria-label="시공 사례 페이지 이동"><button class="page on" type="button" aria-current="page">1</button><button class="page" type="button">2</button><button class="page" type="button">3</button><button class="page next" type="button">다음</button></nav>
      </div>
      <div class="note">현재 선택: <b>시공 장소 — 공장</b>, <b>시공 자재 — 에폭시</b></div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.filter-options').forEach((row) => {
      let startX = 0;
      let startScroll = 0;
      row.addEventListener('pointerdown', (event) => {
        startX = event.clientX;
        startScroll = row.scrollLeft;
        row.setPointerCapture(event.pointerId);
      });
      row.addEventListener('pointermove', (event) => {
        if (!row.hasPointerCapture(event.pointerId)) return;
        row.scrollLeft = startScroll - (event.clientX - startX);
      });
      row.addEventListener('wheel', (event) => {
        if (row.scrollWidth <= row.clientWidth) return;
        event.preventDefault();
        row.scrollLeft += event.deltaY + event.deltaX;
      }, { passive: false });
    });
  </script>
</body>
</html>
