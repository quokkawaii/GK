<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GK 산업 | 모바일 시공 사례 상세</title>
<style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");*{box-sizing:border-box}body{margin:0;background:#e9e9e6;color:#242424;font:14px/1.6 "Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:460px;margin:auto;padding:28px 14px 60px}.intro h1{margin:0 0 7px;font-size:25px;letter-spacing:-1.5px}.intro p{margin:0 0 18px;color:#687068}.phone{background:#fff;border:1px solid #d5d5d2;box-shadow:0 12px 28px #00000017}.header{position:sticky;top:0;z-index:3;height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd}.logo{font-size:20px;font-weight:700}.logo em{font-style:normal;color:#e36f3f}.actions{display:flex;align-items:center;gap:11px}.call{min-height:44px;display:inline-flex;align-items:center;padding:8px 9px;background:#e36f3f;color:#fff;font-size:10px;font-weight:700;text-decoration:none}.menu{min-width:44px;min-height:44px;border:0;background:transparent;font-size:24px}.content{padding:20px 16px}.back{font-size:11px;color:#666}.tag{font-size:10px;color:#d15f34;font-weight:700}.title{margin:16px 0}.title h2{margin:4px 0 0;font-size:27px;letter-spacing:-1.7px}.gallery{border:1px solid #ddd}.stage{position:relative;background:#252525}.photo{height:270px;position:relative;overflow:hidden;background:linear-gradient(145deg,#888580,#383735);background-size:contain;background-repeat:no-repeat;background-position:center}.photo:after{content:"";position:absolute;width:125%;height:34%;bottom:-7%;left:-12%;transform:rotate(-8deg);background:repeating-linear-gradient(90deg,#292929 0 29px,#67635e 29px 33px)}.arrow{position:absolute;z-index:1;top:50%;transform:translateY(-50%);width:44px;height:48px;border:0;background:transparent;color:#fff;text-shadow:0 1px 5px #000;font-size:32px}.arrow.prev{left:5px}.arrow.next{right:5px}.gallery-bottom{padding:11px;background:#f8f8f6}.counter{text-align:center;margin-bottom:9px;font-size:11px;color:#555}.thumbs{display:flex;gap:6px;overflow-x:auto}.thumb{flex:0 0 57px;height:43px;padding:0;border:2px solid transparent;background:linear-gradient(145deg,#888580,#383735)}.thumb.active{border-color:#e36f3f}.details{margin-top:28px;border-top:1px solid #ddd}.details h3{margin:0;padding:19px 0 8px;font-size:16px}.details p{margin:0;color:#555;word-break:keep-all}.info{border-top:1px solid #e1e1de}.row{display:grid;grid-template-columns:92px 1fr;border-bottom:1px solid #e1e1de}.row b,.row span{padding:11px;font-size:12px}.row b{background:#f7f7f5}.row span{color:#555}.viewer{position:fixed;z-index:20;inset:0;display:none;flex-direction:column;background:#111;color:#fff}.viewer.open{display:flex}.viewer-head{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.close{min-width:44px;min-height:44px;border:0;background:transparent;color:#fff;font-size:27px}.viewer .stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1;padding:12px 45px}.viewer .photo{width:100%;height:min(65vh,560px)}.viewer .gallery-bottom{background:#111}.viewer .counter{color:#eee}.viewer .arrow.prev{left:5px}.viewer .arrow.next{right:5px}@media(min-width:461px){.phone{border-radius:14px}}</style></head>
<body><main class="wrap"><header class="intro"><h1>모바일 시공 사례 상세</h1><p>여러 시공 사진과 설명을 같은 흐름에서 확인합니다.</p></header><article class="phone"><header class="header"><div class="logo">GK <em>산업</em></div><div class="actions"><a class="call" href="tel:15880000">전화 문의</a><button class="menu" type="button">☰</button></div></header><div class="content"><div class="back">← 시공 사례 목록</div><div class="title"><span class="tag">공장 · 에폭시</span><h2>화성시 공장 에폭시</h2></div><section class="gallery"><div class="stage"><div class="photo" data-open></div><button class="arrow prev" type="button">‹</button><button class="arrow next" type="button">›</button></div><div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button></div></div></section><section class="details"><h3>시공 내용</h3><p>예시 설명입니다. 현장 바닥 상태를 확인한 뒤 에폭시 공법을 적용한 시공 사례입니다.</p></section><section class="details"><h3>시공 정보</h3><div class="info"><div class="row"><b>시공 장소</b><span>화성시 공장</span></div><div class="row"><b>적용 공법</b><span>에폭시 바닥 시공</span></div><div class="row"><b>사용 제품</b><span>에폭시 (예시)</span></div></div></section></div></article></main><section class="viewer"><header class="viewer-head"><span>시공 사진</span><button class="close" type="button">×</button></header><div class="stage"><div class="photo"></div><button class="arrow prev" type="button">‹</button><button class="arrow next" type="button">›</button></div><div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button><button class="thumb"></button></div></div></section><script>const viewer=document.querySelector('.viewer'),groups=[...document.querySelectorAll('.thumbs')],counters=[...document.querySelectorAll('.counter b')];let current=0;function show(index){current=(index+6)%6;counters.forEach(c=>c.textContent=current+1);groups.forEach(g=>[...g.children].forEach((t,i)=>t.classList.toggle('active',i===current)))}document.querySelectorAll('.prev').forEach(b=>b.addEventListener('click',()=>show(current-1)));document.querySelectorAll('.next').forEach(b=>b.addEventListener('click',()=>show(current+1)));groups.forEach(g=>[...g.children].forEach((t,i)=>t.addEventListener('click',()=>show(i)));document.querySelector('[data-open]').addEventListener('click',()=>viewer.classList.add('open'));document.querySelector('.close').addEventListener('click',()=>viewer.classList.remove('open'));</script><script src="mobile-shell.js"></script></body></html>
