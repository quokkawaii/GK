    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #FFFFFF; color: #191F28; font-family: Arial, "Noto Sans KR", sans-serif; } body.modal-open { overflow: hidden; }
      main { max-width: 430px; margin: 0 auto; padding: 24px 14px 50px; }.intro h1 { margin: 0 0 7px; font-size: 24px; letter-spacing: -1.5px; }.intro p { margin: 0 0 17px; color: #8B95A1; font-size: 13px; line-height: 1.6; }
      .phone { position: relative; height: 720px; overflow: hidden; border: 8px solid #191F28; border-radius: 28px; background: #f5f5f3; box-shadow: 0 12px 26px #0002; }.header { height: 56px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #ddd; font-size: 14px; font-weight: 800; }.call { color: #1B64DA; font-size: 11px; }.list { display: grid; gap: 10px; padding: 14px; }.card { width: 100%; height: 128px; overflow: hidden; border: 1px solid #ddd; background: #fff; color: inherit; text-align: left; }.card:focus-visible { outline: 3px solid #1B64DA; outline-offset: 3px; }.card-photo { height: 86px; background: linear-gradient(145deg, #88857f, #383735); }.card p { margin: 0; padding: 9px; font-size: 12px; font-weight: 700; }.shade { position: absolute; inset: 0; display: none; background: #111a; }
      .popup { position: absolute; right: 0; bottom: 0; left: 0; display: none; height: 585px; overflow: auto; background: #fff; border-radius: 19px 19px 0 0; box-shadow: 0 -10px 24px #0004; transition: transform 160ms ease-out; }.handle { width: 100%; height: 22px; padding-top: 9px; cursor: grab; touch-action: none; }.handle::after { content: ""; display: block; width: 32px; height: 4px; margin: 0 auto; border-radius: 99px; background: #c8c8c4; }.title { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px 15px; background: #fff; border-bottom: 1px solid #ddd; }.title h2 { margin: 0; font-size: 21px; letter-spacing: -1.4px; }.close { width: 40px; height: 40px; flex: 0 0 40px; border: 0; background: transparent; color: #444; font-size: 27px; }.stage { position: relative; background: rgba(0, 12, 30, .8); }.photo { position: relative; height: 230px; overflow: hidden; background: linear-gradient(145deg, #8a8781, #302f2c); }.photo::after { content: ""; position: absolute; left: -8%; bottom: -5%; width: 116%; height: 42%; transform: rotate(-7deg); background: repeating-linear-gradient(90deg, #262624 0 24px, #696965 24px 27px); }.gallery .photo { cursor: zoom-in; }.arrow { position: absolute; top: 50%; z-index: 1; width: 44px; height: 48px; transform: translateY(-50%); border: 0; background: transparent; color: #fff; font-size: 32px; text-shadow: 0 1px 5px #000; }.prev { left: 5px; }.next { right: 5px; }.gallery-bottom { padding: 10px; background: #F2F4F6; }.counter { margin-bottom: 9px; text-align: center; color: #4E5968; font-size: 11px; }.thumbs { display: flex; gap: 6px; overflow-x: auto; }.thumb { flex: 0 0 57px; height: 43px; border: 2px solid transparent; background: linear-gradient(145deg, #88857f, #383735); }.thumb.active { border-color: #1B64DA; }.details { padding: 17px 15px 24px; }.details h3 { margin: 0 0 8px; font-size: 15px; }.details p { margin: 0; color: #4E5968; font-size: 13px; line-height: 1.65; }.info { display: grid; grid-template-columns: 92px 1fr; margin-top: 17px; border-top: 1px solid #E5E8EB; }.info div { padding: 10px; border-bottom: 1px solid #E5E8EB; font-size: 12px; }.info div:nth-child(odd) { background: #F2F4F6; font-weight: 700; }.viewer { position: fixed; z-index: 5; inset: 0; display: none; flex-direction: column; background: #111; color: #fff; }.viewer.open { display: flex; }.viewer-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 12px; font-weight: 700; }.viewer .close { color: #fff; }.viewer .stage { display: flex; flex: 1; align-items: center; justify-content: center; padding: 12px 45px; }.viewer .photo { width: 100%; height: min(65vh, 560px); }.viewer .gallery-bottom { background: #111; }.viewer .counter { color: #eee; }
    </style>
  <style data-design-source="toss-marketing">
  :root { color-scheme: light; }
  body { background: #FFFFFF !important; color: #191F28 !important; font-family: "Toss Product Sans", "Pretendard", "Noto Sans KR", sans-serif !important; font-size: 16px; line-height: 24px; }
  h1, .hero h1 { font-size: 36px !important; line-height: 54px !important; font-weight: 700 !important; }

  <body>
    <main><header class="intro"><h1>모바일 시공 사례 팝업</h1><p>목록 카드 전체를 누르면 아래 시트가 열리고, 사진·상세 정보를 같은 화면에서 확인합니다.</p></header><section class="phone"><header class="header"><span>GK 산업</span><span class="call">전화 문의</span></header><div class="list"><button class="card" type="button" data-case-card data-case-title="밀양 공장 크리트"><div class="card-photo"></div><p>밀양 공장 크리트</p></button><button class="card" type="button" data-case-card data-case-title="대명항 MMA"><div class="card-photo"></div><p>대명항 MMA</p></button></div><div class="shade" data-close-popup></div><section class="popup" id="popup" aria-label="시공 사례 상세"><div class="handle" data-drag-handle></div><header class="title"><h2>밀양 공장 크리트</h2><button class="close" type="button" data-close-popup aria-label="상세 팝업 닫기">×</button></header><section class="gallery"><div class="stage"><div class="photo" data-open-viewer></div><button class="arrow prev" type="button" aria-label="이전 사진">‹</button><button class="arrow next" type="button" aria-label="다음 사진">›</button></div><div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button></div></div></section><section class="details"><h3>시공 내용</h3><p>실제 서비스에서는 사례 JSON의 시공 내용을 표시합니다.</p><div class="info"><div>시공 장소</div><div>밀양 공장</div><div>시공 자재</div><div>크리트</div></div></section></section></section></main><section class="viewer" id="viewer" aria-label="사진 확대 보기"><header class="viewer-head"><span>시공 사진</span><button class="close" type="button" data-close-viewer aria-label="사진 확대 닫기">×</button></header><div class="stage"><div class="photo"></div><button class="arrow prev" type="button" aria-label="이전 사진">‹</button><button class="arrow next" type="button" aria-label="다음 사진">›</button></div><div class="gallery-bottom"><div class="counter"><b>1</b> / 6</div><div class="thumbs"><button class="thumb active" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button><button class="thumb" type="button"></button></div></div></section><script>const viewer=document.querySelector("#viewer"),popup=document.querySelector("#popup"),shade=document.querySelector(".shade"),handle=document.querySelector("[data-drag-handle]"),totalPhotos=6;let startY=0,dragY=0,currentPhoto=0,viewerTouchX=0,openingCard=null;const galleryGroups=[...document.querySelectorAll(".gallery, .viewer")];function showPhoto(index){currentPhoto=(index+totalPhotos)%totalPhotos;galleryGroups.forEach(group=>{group.querySelector(".counter b").textContent=currentPhoto+1;group.querySelectorAll(".thumb").forEach((thumb,thumbIndex)=>thumb.classList.toggle("active",thumbIndex===currentPhoto))})}function openPopup(card){openingCard=card;document.querySelector(".title h2").textContent=card.dataset.caseTitle;showPhoto(0);shade.style.display="block";popup.style.display="block";popup.style.transform="translateY(0)";document.body.classList.add("modal-open");popup.querySelector(".close").focus()}function closePopup(){popup.style.transform="translateY(100%)";document.body.classList.remove("modal-open");setTimeout(()=>{popup.style.display="none";shade.style.display="none";openingCard?.focus()},160)}document.querySelectorAll("[data-case-card]").forEach(card=>card.addEventListener("click",()=>openPopup(card)));document.querySelectorAll("[data-close-popup]").forEach(element=>element.addEventListener("click",closePopup));handle.addEventListener("pointerdown",event=>{startY=event.clientY;dragY=0;popup.style.transition="none";handle.setPointerCapture(event.pointerId)});handle.addEventListener("pointermove",event=>{dragY=Math.max(0,event.clientY-startY);popup.style.transform=`translateY(${dragY}px)`});handle.addEventListener("pointerup",()=>{popup.style.transition="transform 160ms ease-out";if(dragY>100){closePopup()}else{popup.style.transform="translateY(0)"}});document.querySelectorAll(".arrow.prev").forEach(button=>button.addEventListener("click",()=>showPhoto(currentPhoto-1)));document.querySelectorAll(".arrow.next").forEach(button=>button.addEventListener("click",()=>showPhoto(currentPhoto+1)));document.querySelectorAll(".thumb").forEach((thumb,index)=>thumb.addEventListener("click",()=>showPhoto(index%totalPhotos)));document.querySelector("[data-open-viewer]").addEventListener("click",()=>viewer.classList.add("open"));document.querySelector("[data-close-viewer]").addEventListener("click",()=>viewer.classList.remove("open"));const viewerStage=viewer.querySelector(".stage");viewerStage.addEventListener("touchstart",event=>{viewerTouchX=event.changedTouches[0].clientX},{passive:true});viewerStage.addEventListener("touchend",event=>{const distance=event.changedTouches[0].clientX-viewerTouchX;if(Math.abs(distance)>=45){showPhoto(distance<0?currentPhoto+1:currentPhoto-1)}},{passive:true});</script>
