<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지케이 산업 | 공통 히어로 시안</title>
    <style>
      :root {
        --canvas: #ffffff;
        --surface: #f2f4f6;
        --foreground: #191f28;
        --body: #4e5968;
        --border: #e5e8eb;
        --accent: #1b64da;
        --accent-soft: #e8f3ff;
        --dark: rgba(0, 12, 30, 0.8);
        --content-width: 1180px;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; background: var(--surface); scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--foreground);
        font-family: "Toss Product Sans", "Pretendard", "Noto Sans KR", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      a { color: inherit; text-decoration: none; }
      button, a { font: inherit; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

      .preview-note {
        max-width: var(--content-width);
        margin: 0 auto;
        padding: 24px;
        color: var(--body);
        font-size: 14px;
      }
      .hero {
        max-width: var(--content-width);
        margin: 0 auto;
        padding: 0 24px 76px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
        align-items: center;
        gap: 64px;
        min-height: 500px;
      }
      .hero-copy { max-width: 600px; }
      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }
      h1 {
        margin: 16px 0 20px;
        font-size: clamp(40px, 5vw, 64px);
        line-height: 1.12;
        letter-spacing: -0.07em;
        word-break: keep-all;
      }
      .hero-description {
        max-width: 500px;
        margin: 0;
        color: var(--body);
        font-size: 18px;
        line-height: 1.6;
        word-break: keep-all;
      }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
      .hero-social-links { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
      .hero-social-links a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--body);
        font-size: 13px;
        font-weight: 600;
      }
      .hero-social-links a:hover { border-color: var(--accent); color: var(--accent); }
      .hero-social-links img { width: 20px; height: 20px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 7px;
        font-weight: 600;
      }
      .button-primary { background: var(--accent); color: var(--canvas); }
      .button-secondary { background: var(--dark); color: var(--canvas); }
      .mobile-phone { display: none; }
      .hero-image {
        position: relative;
        min-height: 400px;
        overflow: hidden;
        border-radius: 16px;
        background: var(--dark);
      }
      .hero-image img { display: block; width: 100%; height: 100%; min-height: 400px; object-fit: cover; }
      .slide-button {
        position: absolute;
        top: 50%;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border: 1px solid rgb(255 255 255 / 65%);
        border-radius: 7px;
        background: rgb(0 12 30 / 65%);
        color: var(--canvas);
        font-size: 28px;
        line-height: 1;
        transform: translateY(-50%);
      }
      .slide-button:hover { background: var(--dark); }
      .slide-button.previous { left: 16px; }
      .slide-button.next { right: 16px; }
      .hero-image::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgb(0 12 30 / 30%), transparent 55%);
        content: "";
        pointer-events: none;
      }
      .case-caption {
        position: absolute;
        right: 20px;
        bottom: 20px;
        z-index: 1;
        padding: 10px 12px;
        background: rgb(0 12 30 / 80%);
        color: var(--canvas);
        font-size: 13px;
      }
      .side-call {
        position: fixed;
        top: 50%;
        right: 20px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: 172px;
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 7px;
        background: var(--dark);
        color: var(--canvas);
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        transform: translateY(-50%) translateX(20px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }
      .side-call-phone { display: block; }
      .side-call-socials { display: flex; gap: 8px; }
      .side-call-socials a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 7px;
      }
      .side-call-socials img { width: 20px; height: 20px; }
      .side-call.is-visible { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
      .after-hero {
        min-height: 620px;
        padding: 76px 24px;
        background: var(--canvas);
      }
      .after-hero-inner { max-width: var(--content-width); margin: 0 auto; }
      .after-hero h2 { margin: 0; font-size: 30px; letter-spacing: -0.05em; }
      .after-hero p { max-width: 540px; margin: 16px 0 0; color: var(--body); }

      @media (max-width: 767px) {
        .preview-note { padding: 20px 16px; }
        .hero { padding: 0 16px 56px; }
        .hero-grid { display: flex; flex-direction: column; align-items: stretch; gap: 36px; min-height: 0; }
        .hero-copy { max-width: none; padding-top: 12px; }
        h1 { margin-top: 12px; font-size: 40px; }
        .hero-description { font-size: 16px; }
        .hero-actions { margin-top: 24px; }
        .button { width: 100%; }
        .desktop-phone { display: none; }
        .mobile-phone { display: inline-flex; }
        .hero-image { min-height: 260px; border-radius: 12px; }
        .hero-image img { min-height: 260px; }
        .side-call { display: none; }
        .after-hero { min-height: 520px; padding: 56px 16px; }
        .after-hero h2 { font-size: 27px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <p class="preview-note">공통 히어로 시안 · 대표 사진과 전화 문의 CTA를 첫 화면에서 함께 제공합니다.</p>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-grid">
          <div class="hero-copy">
            <p class="eyebrow">지케이 산업</p>
            <h1 id="hero-title">현장에 맞는<br />바닥 시공</h1>
            <p class="hero-description">공장, 주차장, 주방 등 다양한 공간의 바닥 시공 사례와 사용 제품 정보를 확인해 보세요.</p>
            <div class="hero-actions">
              <a class="button button-primary" href="#cases">시공 사례 보기</a>
              <span class="button button-secondary desktop-phone">전화 문의 010-9261-2061</span>
              <a class="button button-secondary mobile-phone" href="tel:01092612061" aria-label="전화 문의 010-9261-2061">전화 문의 010-9261-2061</a>
            </div>
            <div class="hero-social-links" aria-label="공식 외부 채널">
              <a href="https://www.instagram.com/95ms114?igsh=amd5YmJ1eWZzbW43" target="_blank" rel="noreferrer" aria-label="Instagram 새 탭 열기">
                <img src="../../../../public/images/social/instagram.svg" alt="" /> Instagram
              </a>
              <a href="https://www.youtube.com/@%ED%95%9C%EC%8A%A4%ED%86%A0%EB%A6%AC-w4b/shorts" target="_blank" rel="noreferrer" aria-label="YouTube 새 탭 열기">
                <img src="../../../../public/images/social/youtube.svg" alt="" /> YouTube
              </a>
            </div>
          </div>
          <figure class="hero-image">
            <button class="slide-button previous" type="button" aria-label="이전 시공 사례 사진">‹</button>
            <img id="hero-slide-image" src="../../../../public/images/cases/case-001-miryang-factory-crete/01.jpg" alt="밀양 공장 크리트 시공 사진 1" />
            <button class="slide-button next" type="button" aria-label="다음 시공 사례 사진">›</button>
            <figcaption class="case-caption" id="hero-slide-caption" aria-live="polite">밀양 공장 크리트</figcaption>
          </figure>
        </div>
      </section>

      <section class="after-hero" id="cases" aria-labelledby="after-hero-title">
        <div class="after-hero-inner">
          <h2 id="after-hero-title">히어로 다음 콘텐츠 영역</h2>
          <p>데스크톱과 태블릿에서는 이 지점부터 오른쪽 전화 문의 CTA가 나타납니다. 모바일에서는 히어로 안의 전화 문의 CTA만 유지합니다.</p>
        </div>
      </section>
    </main>

    <aside class="side-call" aria-label="전화 문의 및 공식 외부 채널">
      <a class="side-call-phone" href="tel:01092612061" aria-label="전화 문의 010-9261-2061">전화 문의<br />010-9261-2061</a>
      <div class="side-call-socials">
        <a href="https://www.instagram.com/95ms114?igsh=amd5YmJ1eWZzbW43" target="_blank" rel="noreferrer" aria-label="Instagram 새 탭 열기"><img src="../../../../public/images/social/instagram.svg" alt="" /></a>
        <a href="https://www.youtube.com/@%ED%95%9C%EC%8A%A4%ED%86%A0%EB%A6%AC-w4b/shorts" target="_blank" rel="noreferrer" aria-label="YouTube 새 탭 열기"><img src="../../../../public/images/social/youtube.svg" alt="" /></a>
      </div>
    </aside>

    <script>
      const sideCall = document.querySelector(".side-call");
      const hero = document.querySelector(".hero");
      const slideImage = document.querySelector("#hero-slide-image");
      const slideCaption = document.querySelector("#hero-slide-caption");
      const previousButton = document.querySelector(".slide-button.previous");
      const nextButton = document.querySelector(".slide-button.next");
      const slides = [
        { title: "밀양 공장 크리트", image: "../../../../public/images/cases/case-001-miryang-factory-crete/01.jpg", alt: "밀양 공장 크리트 시공 사진 1" },
        { title: "대명항 MMA", image: "../../../../public/images/cases/case-002-daemyeong-port-mma/01.jpg", alt: "대명항 MMA 시공 사진" },
        { title: "평택 공장 비노출 방수", image: "../../../../public/images/cases/case-003-pyeongtaek-factory-exposed-waterproofing/01.jpg", alt: "평택 공장 비노출 방수 시공 사진 1" },
        { title: "천안 공장 크리트", image: "../../../../public/images/cases/case-004-cheonan-factory-crete/01.jpg", alt: "천안 공장 크리트 시공 사진 1" },
        { title: "음성 공장 크리트", image: "../../../../public/images/cases/case-005-eumseong-factory-crete/01.jpg", alt: "음성 공장 크리트 시공 사진 1" },
        { title: "공장 크리트", image: "../../../../public/images/cases/case-006-factory-crete/01.jpg", alt: "공장 크리트 시공 사진 1" },
        { title: "대전 주차장 크리트", image: "../../../../public/images/cases/case-007-daejeon-parking-crete/01.jpg", alt: "대전 주차장 크리트 시공 사진 1" },
        { title: "주방 MMA", image: "../../../../public/images/cases/case-008-kitchen-mma/01.jpg", alt: "주방 MMA 시공 사진" },
        { title: "분당 군부대 MMA", image: "../../../../public/images/cases/case-009-bundang-military-mma/01.jpg", alt: "분당 군부대 MMA 시공 사진 1" },
      ];
      let currentSlide = 0;

      const renderSlide = (index) => {
        currentSlide = (index + slides.length) % slides.length;
        const slide = slides[currentSlide];
        slideImage.src = slide.image;
        slideImage.alt = slide.alt;
        slideCaption.textContent = slide.title;
      };

      previousButton.addEventListener("click", () => renderSlide(currentSlide - 1));
      nextButton.addEventListener("click", () => renderSlide(currentSlide + 1));

      const updateSideCall = () => {
        sideCall.classList.toggle("is-visible", window.scrollY > hero.offsetHeight * 0.55);
      };

      window.addEventListener("scroll", updateSideCall, { passive: true });
      updateSideCall();
    </script>
  </body>
</html>
